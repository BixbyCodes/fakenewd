[theme]
base = "light"
primaryColor = "#23272B"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#EDE9E1"
textColor = "#1F2328"
font = "sans serif"

[server]
maxUploadSize = 1
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
